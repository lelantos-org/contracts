# Echidna configuration for test/echidna/.
#
# Complements the Foundry invariant suite: the properties match those in
# test/invariant/, but Echidna keeps a corpus on disk between runs, so nightly
# jobs build on previous runs instead of restarting from a fixed seed. See
# test/echidna/EchidnaMasp.sol for details and for where the handlers differ
# from the Foundry ones.

testMode: property
# Every property is a pure state check, so a reverting handler call (an early
# cancel, an empty flush) is a normal outcome rather than a finding.
# `cancelOne` relies on this: it leaves the cancelDelay guard in place, so
# calls made too early revert.
testLimit: 50000
# Long for Echidna, and required. State resets between sequences, so anything
# needing many successful calls must fit in one sequence: the root ring holds
# ROOT_HISTORY = 64 entries and evicts only once full, so the eviction
# properties need 64+ landed root advances, spread across ~20 handlers that
# mostly early-return. At seqLen 100 they do not fire within 40k calls.
seqLen: 400

# Wall-clock cap on a single campaign, on top of `testLimit`; whichever is
# reached first ends the run, and the corpus is written either way. The limit
# alone does not bound runtime: the time to spend a fixed number of sequences
# grows with the corpus restored from the previous night (the EchidnaMasp
# property sweep took 89, 103, 121 and 137 minutes for the same 400k limit
# across 2026-09-17..20, against corpora of 45-63 MB), so a nightly job sized
# against last month's runtime eventually overruns and is cancelled, losing
# the whole campaign. 2h trades the tail of a long campaign — the sequences a
# capped run does not reach are the least likely to be novel, since the corpus
# is replayed first — for a nightly that always finishes and always saves.
# `just echidna <big limit>` is capped the same way locally.
timeout: 7200

# `cancelDeposit` unlocks CANCEL_DELAY_DEFAULT (7_200) blocks after submit.
# The per-call block delay must be able to exceed that, or the cancel path is
# unreachable and three of the four properties never see a Cancelled id. The
# ceiling is ~3.5x the delay so sequences land on both sides of the guard.
maxBlockDelay: 25000
# Much shorter than the block delay above, because the two are drawn
# independently and the pause properties need both at once: a paused pool
# (timestamp-bounded) holding a deposit whose cancelDelay of 7_200 blocks has
# elapsed. At 300_000s (3.5 days against a pause of at most 7), nearly any
# single call ends the pause before a block jump crosses the cancel delay, and
# `pausedCancelHonoured` does not reach the pool. Keeping time slow relative to
# blocks makes the overlap reachable.
maxTimeDelay: 15000

# `corpusDir` is not set here. `just _echidna-config` emits it per contract,
# because a corpus is a set of call sequences against one ABI: a shared
# directory would have each target replaying the other's sequences, none of
# which decode to callable functions.
# The handlers do not branch on msg.sender (the payer originates its own
# privileged calls through EchidnaMaspPayer), so multiple senders only add
# noise. One sender keeps sequences shorter and the corpus denser.
sender: ["0x0000000000000000000000000000000000010000"]

# Pins the platform. Under auto-detection, crytic-compile tries its `solc`
# platform first on a .sol path and writes an unreadable combined_solc.json
# ("Failed to parse combined JSON file crytic-export/combined_solc.json").
# Echidna recovers by falling through to the Foundry platform, but its Slither
# pass for constant extraction uses `--ignore-compile` and reads the same
# broken export, failing with "Running slither failed. Echidna will continue,
# however fuzzing will likely be less effective." Without Slither, the seeded
# constants that let mutations reach guards are lost, with only a warning.
cryticArgs: ["--compile-force-framework", "foundry"]

# `--ignore-compile` is intentionally absent. CI adds it because echidna-action
# runs Echidna in a container without Foundry. Locally it would break
# `just echidna`: a prebuilt `out/build-info` must be complete, and an
# incremental `forge build` rewrites entries only for what it recompiled, so
# crytic-compile fails on a missing `<hash>.output.json`. The `slither` recipe
# works around the same issue with a preceding `forge clean`, a full via_ir
# rebuild that is acceptable nightly but not on every local fuzzer run. Locally
# crytic-compile therefore drives the build itself, incrementally.
