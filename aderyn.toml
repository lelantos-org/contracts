# Aderyn (Cyfrin): Rust Solidity static analyzer. Complements Slither; the two
# detector sets overlap only partly.
# Run with `just aderyn`; CI runs the same scan and gates on High findings
# (see the `aderyn` job in .github/workflows/ci.yml).
#
# Only schema version 1 exists.
version = 1

root = "."
src = "src/"

# Generated by snarkjs from the circuits and regenerated on every circuit
# change, so findings there are not actionable in this repo. Kept consistent
# with `filter_paths` in slither.config.json and the `ignore` lists under [fmt]
# and [lint] in foundry.toml.
#
# This also suppresses the `yul-return` highs: the snarkjs verifiers end every
# pairing check with a bare `return(0, 0x20)` inside Yul.
exclude = ["src/verifiers/"]

[detectors]
# All other detectors are enabled. Individual false positives are suppressed at
# the site with `// aderyn-fp-next-line(<detector>)` rather than globally here,
# so a detector still fires on new code. `aderyn registry` lists the names.
#
# costly-loop: excluded to match slither.config.json, which excludes the same
# detector. The loops it flags are bounded batch operations whose per-item
# storage write is their purpose.
exclude = ["costly-loop"]

[env]
# Aderyn resolves `src` and remappings through foundry.toml; pin the profile so
# a developer with FOUNDRY_PROFILE set locally scans the same sources CI does.
FOUNDRY_PROFILE = "default"
