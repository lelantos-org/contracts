# Aderyn (Cyfrin) — Rust Solidity static analyzer. Complements Slither: the two
# overlap only partly, and Aderyn's AST-level detectors catch a different slice.
# Run with `just aderyn`; CI runs the same scan and gates on High findings
# (see the `aderyn` job in .github/workflows/ci.yml).
#
# DO NOT CHANGE: only schema version 1 exists.
version = 1

root = "."
src = "src/"

# Generated by snarkjs from the circuits and regenerated on every circuit
# change, so a finding here is not actionable in this repo. Kept in step with
# the same carve-out in slither.config.json (`filter_paths`), and with the
# `ignore` lists under [fmt] and [lint] in foundry.toml.
#
# This is what suppresses the `yul-return` highs: the snarkjs verifiers end
# every pairing check with a bare `return(0, 0x20)` inside Yul.
exclude = ["src/verifiers/"]

[detectors]
# Everything else stays on. Individual false positives are suppressed at the
# site with `// aderyn-fp-next-line(<detector>)` rather than globally here, so
# a detector keeps firing on new code. `aderyn registry` lists the names.
#
# costly-loop: excluded to match slither.config.json, which drops the same
# detector. The loops it flags are bounded batch operations whose per-item
# storage write is the point of the loop.
exclude = ["costly-loop"]

[env]
# Aderyn resolves `src` and remappings through foundry.toml; pin the profile so
# a developer with FOUNDRY_PROFILE set locally scans the same sources CI does.
FOUNDRY_PROFILE = "default"
