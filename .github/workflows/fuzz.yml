name: fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: [ubuntu-latest]
    timeout-minutes: 120
    env:
      FOUNDRY_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in step with .github/workflows/ci.yml.
          version: v1.8.1
      - uses: extractions/setup-just@v2
      - run: just version
      - name: Heavy fuzz + invariant sweep
        run: just test-fuzz

  # The committed Quint traces use a pinned seed so CI is deterministic and
  # regeneration is a no-op diff, which also limits coverage to the same traces
  # on every run. This nightly job generates fresh random traces in volume,
  # writing to scratch paths so the committed suite is untouched.
  quint-fresh:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in step with .github/workflows/ci.yml.
          version: v1.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just quint-install
      - name: Fresh-seed Quint sweep
        run: just quint-fresh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quint-fresh-traces
          path: test/fixtures/quint-fresh/

  # Echidna covers the same MASP state machine as the invariant sweep above,
  # with an engine that keeps its corpus and properties the Foundry handlers
  # cannot express; see test/echidna/README.md. Foundry restarts from a fixed
  # seed every night, so a rare sequence must be rediscovered each time, while
  # Echidna mutates a corpus restored from the previous run. This depends on
  # the cache below round-tripping.
  #
  # One job per target, rather than one job running every sweep in sequence.
  # A campaign's runtime grows with the corpus it restores, so under a single
  # job budget a slow leading campaign leaves the sweeps behind it too little
  # time and the job is cancelled mid-run. Per target, each job's budget
  # depends on one contract's two campaigns only, and the wall-clock `timeout`
  # in echidna.yaml bounds each campaign on top of its test limit.
  echidna:
    runs-on: [ubuntu-latest]
    strategy:
      # A broken property on one target is a finding about that target only;
      # the other targets' campaigns still run.
      fail-fast: false
      matrix:
        include:
          # The test limits are upper bounds on sequences generated; `timeout`
          # in echidna.yaml bounds the same campaign in wall-clock time, and
          # whichever is reached first ends it.
          - contract: EchidnaMasp
            property_limit: 400000
            optimize_limit: 150000
          - contract: EchidnaMaspYield
            property_limit: 250000
            optimize_limit: 150000
          - contract: EchidnaGenericCall
            property_limit: 150000
            optimize_limit: 50000
    # A leg is one build plus at most two campaigns, each capped at 7200s by
    # `timeout` in echidna.yaml, so ~250 minutes is the worst case it can
    # reach by fuzzing. Anything past this is a hang outside Echidna's own
    # accounting and should fail rather than run to the 6h ceiling.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in step with .github/workflows/ci.yml.
          version: v1.8.1
      - uses: extractions/setup-just@v2
      # The build and config generation run on the host. echidna-action runs
      # Echidna inside the trailofbits/echidna container, which has Echidna,
      # Slither and crytic-compile but no Foundry, so it cannot build. The
      # `crytic-args` below point crytic-compile at the `out/build-info`
      # written here.
      #
      # The build must use [profile.echidna]: it pre-links the YieldOps and
      # DepositOps libraries, without which Echidna aborts with "Unlinked
      # libraries detected in bytecode of contract src/MASP.sol:MASP".
      #
      # `--force` is required. crytic-compile reads `out/build-info`, and an
      # incremental Foundry build rewrites entries only for what it
      # recompiled, so crytic-compile fails on a missing `<hash>.output.json`.
      # A fresh checkout builds everything; `--force` keeps the step correct if
      # a cache is introduced.
      - run: FOUNDRY_PROFILE=echidna forge build --build-info --force --skip script
      # Only this leg's target. Both of its configs are written by this single
      # invocation, before either sweep, so the ordering constraint the
      # `echidna` recipe in the justfile handles (a config generated after
      # another contract's sweep fails on a missing ABI) does not arise.
      - run: just _echidna-config ${{ matrix.contract }}
      # Append-only cache, one entry per target: the key is unique per run so
      # this job always writes a fresh entry, and `restore-keys` picks up the
      # newest previous one for the same contract. A fixed key would restore
      # the first saved corpus indefinitely and never save again, which
      # produces no error in the logs.
      #
      # Restore and save are separate actions rather than one `actions/cache`
      # step. The combined action saves in a post step, and post steps are
      # skipped when a job is cancelled, which is what a `timeout-minutes`
      # expiry is ("Post Run actions/cache@v4 ... skipped"), so a run that
      # times out would drop its corpus. `if: always()` on an explicit save
      # step runs during cancellation.
      - uses: actions/cache/restore@v4
        with:
          path: test/echidna/corpus/${{ matrix.contract }}
          key: echidna-corpus-${{ matrix.contract }}-${{ github.run_id }}
          restore-keys: echidna-corpus-${{ matrix.contract }}-
      # Three targets: the plain-asset state machine, the indexed-asset
      # (yield) accounting, and the generic-call wrapper, in separate
      # contracts because their setups and properties are disjoint; see
      # test/echidna/README.md.
      - name: Echidna property sweep (${{ matrix.contract }})
        uses: crytic/echidna-action@v2
        with:
          files: test/echidna/${{ matrix.contract }}.sol
          contract: ${{ matrix.contract }}
          config: test/echidna/${{ matrix.contract }}.generated.yaml
          echidna-version: v2.3.3
          test-limit: ${{ matrix.property_limit }}
          format: text
          crytic-args: --compile-force-framework foundry --ignore-compile
          # `echidna-version` is pinned: the action's default is `latest`, which
          # would let a new Echidna release fail an unrelated nightly run.
          #
          # `crytic-args` restates the config's `cryticArgs` because a CLI
          # value replaces it rather than extending it, and without the
          # platform pin crytic-compile falls back to the solc platform, whose
          # output it cannot read back.
          #
          # Echidna runs Slither for the constant extraction that seeds its
          # mutations, and under `--ignore-compile` that step depends on the
          # Slither/crytic-compile version pair. Homebrew's pair (Slither
          # 0.11.6 with crytic-compile 0.4.2) crashes in constant folding; the
          # container ships a matched pair, which has not been verified outside
          # it. Success logs "Running slither on ... Done!"; failure logs
          # "Running slither failed. Echidna will continue, however fuzzing will
          # likely be less effective", which reduces mutation quality but not
          # correctness.
      - name: Echidna optimization sweep (${{ matrix.contract }})
        # Runs even when the property sweep above failed: the magnitude report
        # is useful alongside a broken property, and the property sweep remains
        # the gate. Not `always()`, which also fires while the job is being
        # cancelled and would start a fresh campaign inside the cancellation
        # window.
        if: success() || failure()
        # Echidna exits non-zero in optimization mode regardless of result: an
        # optimization target is never "solved" and is reported as an open
        # test (property mode exits 0 on the same contract; optimization mode
        # exits 1 even with every maximum at 0). Without this the job would
        # fail on every run.
        continue-on-error: true
        uses: crytic/echidna-action@v2
        with:
          files: test/echidna/${{ matrix.contract }}.sol
          contract: ${{ matrix.contract }}
          config: test/echidna/${{ matrix.contract }}.optimize.generated.yaml
          echidna-version: v2.3.3
          test-limit: ${{ matrix.optimize_limit }}
          format: text
          crytic-args: --compile-force-framework foundry --ignore-compile
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: test/echidna/corpus/${{ matrix.contract }}
          key: echidna-corpus-${{ matrix.contract }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echidna-corpus-${{ matrix.contract }}
          path: test/echidna/corpus/${{ matrix.contract }}/
          if-no-files-found: warn
