name: publish-abi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      packages: write
    env:
      FOUNDRY_PROFILE: default
      FOUNDRY_VERSION: stable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lelantos-org"
          always-auth: true
          
      - name: Confirm tag version matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *)
              echo "::error::tag '$TAG' is not of the form v<version>"
              exit 1
              ;;
          esac
          pkg=$(node -p "require('./packages/abi/package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag '$TAG' implies version $version, but packages/abi/package.json is $pkg"
            exit 1
          fi
          echo "tag '$TAG' matches packages/abi/package.json version $pkg"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: extractions/setup-just@v2

      - name: Build contracts + generate ABIs
        run: just abi

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/abi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
