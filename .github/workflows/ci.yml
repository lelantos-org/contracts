name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Foundry release is pinned so CI reproduces local bytecode exactly. The
# compiler is pinned by the exact `pragma solidity 0.8.36` in src/, test/ and
# script/; Foundry only fetches it.
env:
  FOUNDRY_PROFILE: default
  FOUNDRY_VERSION: v1.8.1
  ADERYN_VERSION: "0.6.8"
  HALMOS_VERSION: "0.3.3"

# Build caching. A clean via_ir build takes ~4 minutes; with `out/` and `cache/`
# restored, Foundry recompiles only sources whose content hash changed (it does
# not go by mtime, so a fresh checkout still hits). An edit to a widely imported
# file such as src/libs/DepositOps.sol still recompiles ~94 files, about 2/3 of
# a clean build; an unrelated or no-op change builds in seconds.
#
# Each job keeps its own cache because the jobs build differently: `forge test`
# and `forge build` select different outputs, `size` uses the deploy profile,
# and `symbolic` the halmos profile. The key prefix pins the Foundry release
# and foundry.toml: a settings change needs a clean build (see the comment on
# `additional_compiler_profiles` there), so it must not restore an old cache.
# The suffix hashes every compiled source, so a restore-keys hit is incremental.
#
# Slither is not cached: an incremental build leaves superseded files in
# `out/build-info/`, so a source appears in more than one build-info and
# crytic-compile would read both.

jobs:
  test:
    name: Build & test
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-test-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-${{ hashFiles('foundry.lock', 'src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-test-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-
      - run: just version
      - run: just test

  fmt:
    name: Format check
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  size:
    name: Contract size (EIP-170)
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-size-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-${{ hashFiles('foundry.lock', 'src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-size-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-
      - run: just size

  abi:
    name: ABI package
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-build-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-${{ hashFiles('foundry.lock', 'src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-build-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml') }}-
      # Catches a contract rename or removal that breaks the generator before
      # a release is tagged.
      - run: just abi

  quint:
    name: Quint spec & trace drift
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just quint-install
      - run: just quint-spec
      # Fast gate: re-derives the schema hash from the config and compares it
      # against the committed fixtures, without running quint.
      - run: just quint-check
      # Full gate: regenerates and checks nothing changed. The seed is pinned,
      # so a diff indicates either an unregenerated spec edit or
      # non-determinism in the pipeline.
      - run: just quint-diff

  slither:
    name: Slither
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # slither-action installs JS dependencies whenever the target directory
      # has a lockfile, which would need a GitHub Packages token this job does
      # not have. Building here and having the action skip its own toolchain
      # setup keeps the job independent of any lockfile at the repo root and
      # avoids a redundant solc/node/foundry install.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # `--build-info` emits the solc standard-json output that crytic-compile
      # reads under `--ignore-compile`.
      # `--no-dynamic-test-linking`: dynamic test linking (Foundry 1.8+)
      # injects synthetic `foundry-pp/*.sol` sources that crytic-compile cannot
      # resolve. See the `slither` recipe in the justfile.
      # `--skip` excludes test/ and script/: Slither parses every source in
      # build-info before `filter_paths` drops the non-src findings, and test/
      # is 217 of the 274 first-party sources. See the `slither` recipe in the
      # justfile for the measurements and for the informational findings the
      # narrower scope adds.
      - run: forge build --build-info --no-dynamic-test-linking --skip 'test/**' --skip 'script/**'
      # v0.4.2 or later is required: slither 0.11.5 needs Python >=3.10, and
      # earlier action images ship Python 3.9.
      - uses: crytic/slither-action@v0.4.2
        with:
          target: .
          slither-config: slither.config.json
          ignore-compile: true
          fail-on: medium
          # Pinned. Unpinned, the action takes the latest release, so a new
          # detector surfaces as a CI failure on an unrelated PR (for example
          # `reentrancy-balance`, high impact, fires on every balance-delta
          # measurement in SwapWrapper). Bump explicitly after reviewing the
          # new findings.
          slither-version: 0.11.5

  symbolic:
    name: Symbolic (halmos)
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install halmos==${{ env.HALMOS_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            out/halmos
            cache/halmos
          key: forge-halmos-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ env.HALMOS_VERSION }}-${{ hashFiles('foundry.toml') }}-${{ hashFiles('foundry.lock', 'src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: forge-halmos-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ env.HALMOS_VERSION }}-${{ hashFiles('foundry.toml') }}-
      - run: just halmos

  aderyn:
    name: Aderyn
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: extractions/setup-just@v2
      # Aderyn drives solc itself rather than reading a forge build, and its
      # bundled svm release list does not include solc 0.8.36, so on a clean
      # runner it cannot resolve the `=0.8.36` pragma and fails with
      # "No solc version exists that matches the version requirement".
      # It reads the shared svm store (~/.svm), so a forge build is sufficient:
      # Foundry downloads 0.8.36 there and Aderyn finds it.
      #
      # Only the download is needed, not the artifacts, so this compiles one
      # small file with `--force` into a throwaway directory (seconds). Do not
      # restore a build cache here: a cache hit makes the build a no-op, the
      # compiler is never fetched, and Aderyn fails as above.
      # TODO: remove once an Aderyn release's list includes 0.8.36.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Populate the svm store with solc 0.8.36
        run: forge build --force src/libs/Fees.sol --out "$RUNNER_TEMP/solc-out" --cache-path "$RUNNER_TEMP/solc-cache"
      - name: Install Aderyn ${{ env.ADERYN_VERSION }}
        run: |
          curl -sSfL "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-installer.sh" \
            | ADERYN_UNMANAGED_INSTALL="$HOME/.aderyn/bin" sh
          echo "$HOME/.aderyn/bin" >> "$GITHUB_PATH"
      - run: just aderyn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: |
            aderyn-report.md
            aderyn-report.json
          if-no-files-found: warn
