name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_PROFILE: default
  FOUNDRY_VERSION: stable

jobs:
  test:
    name: Build & test
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just version
      - run: just test

  fmt:
    name: Format check
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  size:
    name: Contract size (EIP-170)
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just size

  abi:
    name: ABI package
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      # Catches a contract rename/removal breaking the generator before a
      # release tag does.
      - run: just abi

  slither:
    name: Slither
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # slither-action installs JS dependencies whenever the target directory
      # has a lockfile, and the root one pulls @lelantos-org/* from GitHub
      # Packages — which this job has no token for. Static analysis needs none
      # of those (they are TypeScript fixture generators), so the build is done
      # here and the action is told to skip its own toolchain setup entirely.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # `--build-info` emits the solc standard-json output that crytic-compile
      # reads under `--ignore-compile`.
      - run: forge build --build-info
      - uses: crytic/slither-action@v0.4.0
        with:
          target: .
          slither-config: slither.config.json
          ignore-compile: true
          fail-on: medium
