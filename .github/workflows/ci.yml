name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Foundry release is pinned so CI reproduces local bytecode exactly. The
# compiler itself is pinned by the exact `pragma solidity 0.8.36` in
# src/, test/ and script/ — foundry only has to fetch it.
env:
  FOUNDRY_PROFILE: default
  FOUNDRY_VERSION: v1.8.1
  ADERYN_VERSION: "0.6.8"
  HALMOS_VERSION: "0.3.3"

jobs:
  test:
    name: Build & test
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just version
      - run: just test

  fmt:
    name: Format check
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  size:
    name: Contract size (EIP-170)
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - run: just size

  abi:
    name: ABI package
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      # Catches a contract rename/removal breaking the generator before a
      # release tag does.
      - run: just abi

  quint:
    name: Quint spec & trace drift
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just quint-install
      - run: just quint-spec
      # Cheap gate: re-derives the schema hash from the config and compares it
      # against the committed fixtures, without running quint.
      - run: just quint-check
      # Expensive gate: actually regenerate and prove it changed nothing. The
      # seed is pinned, so a diff here means either a spec edit that was not
      # regenerated, or something in the pipeline that is not deterministic.
      - run: just quint-diff

  slither:
    name: Slither
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # slither-action installs JS dependencies whenever the target directory
      # has a lockfile, and would need a GitHub Packages token this job does
      # not have. The repo root no longer carries one, so nothing triggers that
      # today — but building here and telling the action to skip its own
      # toolchain setup keeps the job independent of any lockfile reappearing,
      # and skips a redundant solc/node/foundry install either way.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # `--build-info` emits the solc standard-json output that crytic-compile
      # reads under `--ignore-compile`.
      # `--no-dynamic-test-linking`: foundry 1.8 injects synthetic
      # `foundry-pp/*.sol` sources that crytic-compile cannot resolve. The
      # `slither` recipe in the justfile carries the detail.
      - run: forge build --build-info --no-dynamic-test-linking
      # v0.4.2 is the first release whose image is Python 3.10; the 3.9 images
      # in v0.4.0/v0.4.1 cannot install slither 0.11.5 (Requires-Python >=3.10).
      - uses: crytic/slither-action@v0.4.2
        with:
          target: .
          slither-config: slither.config.json
          ignore-compile: true
          fail-on: medium
          # Pinned deliberately. Unpinned, the action takes the latest release,
          # so a new detector lands as a CI failure on an unrelated PR: 0.11.5
          # added `reentrancy-balance` (high impact), which fires on every
          # balance-delta measurement in SwapWrapper. Bump this on purpose,
          # with the findings reviewed, rather than discovering them mid-PR.
          slither-version: 0.11.5

  symbolic:
    name: Symbolic (halmos)
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install halmos==${{ env.HALMOS_VERSION }}
      - run: just halmos

  aderyn:
    name: Aderyn
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: extractions/setup-just@v2
      # Aderyn drives solc itself rather than reading a forge build, and its
      # bundled svm release list predates solc 0.8.36, so on a clean runner it
      # cannot resolve the `=0.8.36` pragma pinned across src/ and dies with
      # "No solc version exists that matches the version requirement".
      # It does read the shared svm store (~/.svm), so a forge build ahead of it
      # is enough: foundry resolves and downloads 0.8.36 there, and aderyn then
      # finds it. Remove once an Aderyn release ships a list that has 0.8.36.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Populate the svm store with solc 0.8.36
        run: forge build --skip test --skip script
      - name: Install Aderyn ${{ env.ADERYN_VERSION }}
        run: |
          curl -sSfL "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-installer.sh" \
            | ADERYN_UNMANAGED_INSTALL="$HOME/.aderyn/bin" sh
          echo "$HOME/.aderyn/bin" >> "$GITHUB_PATH"
      - run: just aderyn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: |
            aderyn-report.md
            aderyn-report.json
          if-no-files-found: warn
