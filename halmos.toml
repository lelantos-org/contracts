# Halmos (bounded symbolic execution) configuration.
#
# Halmos proves a property for every input in a bounded state space, whereas
# `forge test`'s fuzzer samples inputs. It complements the fuzz and invariant
# suites: the tests under `test/symbolic/` restate fuzzed properties as proofs,
# so a regression a 256-run fuzz catches only probabilistically fails
# deterministically here.
#
# Only a `[global]` section is read; halmos rejects a file with any other
# top-level table. Per-test overrides go in NatSpec on the test itself:
#     /// @custom:halmos --loop 4
#
# Run with `just halmos`, which sets FOUNDRY_PROFILE=halmos.

[global]
# Halmos runs `forge build --ast` itself, inheriting FOUNDRY_PROFILE
# from the environment. This must name the same directory as
# `[profile.halmos].out` in foundry.toml, or halmos parses the via-ir artifacts
# the default profile leaves behind.
forge-build-out = "out/halmos"

# Restricts halmos to the symbolic suites. Without this, halmos would also run
# any `check_`-prefixed function added to the fuzz or invariant suites.
match-contract = "Symbolic"

# The solver is left at the default (yices), which halmos ships as a Python
# dependency; bitwuzla and cvc5 are downloaded from GitHub on first use behind
# an interactive confirmation prompt, which would make CI depend on a
# third-party release URL and on `HALMOS_ALLOW_DOWNLOAD`. Yices handles the
# bitvector-heavy queries here (shift/mask bitmap reasoning in NullifierSet,
# ceil-division in Fees).

# Below the 60s default. Every property in the suite solves in well under a
# second, so a query reaching 30s indicates a badly shaped property that should
# be restated rather than given more budget. For this reason `unitFee` has no
# bound or monotonicity properties: they require the solver to reason about a
# division and remain intractable at every argument width. See the note in
# Fees.symbolic.t.sol and the matrix in test/symbolic/README.md.
solver-timeout-assertion = "30s"

# Loop unrolling bound. The spend path loops over the transact shape
# (`TRANSACT_OUT` = 6 outputs, `TRANSACT_IN` = 4 nullifiers checked pairwise)
# and over `MAX_L_BATCH` = 8 batch slots. At 2 (the default) or 4, halmos
# reports "paths have not been fully explored due to the loop unrolling bound"
# and the affected proofs cover only a prefix of each array while still
# passing.
#
# 16 exceeds the widest of those. Every loop bound is a compile-time constant,
# so full unrolling terminates and the proofs are not weakened. A `[PASS]` with
# a loop-bound warning should be treated as a failure and the bound raised.
loop = 16

# Reports path/solver counts, so a test that stops covering anything (e.g. an
# over-strong `vm.assume` leaving zero feasible paths) is visible.
statistics = true
